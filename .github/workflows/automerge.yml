name: 'Automerge Dependabot PRs'

on:
  pull_request_target:
    types: [opened, labeled, synchronize]

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Automerge Dependabot PRs
        uses: pascalgn/automerge-action@v0.15.0
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          mergeMethod: "squash"
          label: "automerge"
          skipUnknown: true
